<ion-content class="register-content">
  <div class="register-wrapper">
    <!-- Decorative Background -->
    <div class="bg-decoration">
      <div class="bg-circle bg-circle-1"></div>
      <div class="bg-circle bg-circle-2"></div>
      <div class="bg-circle bg-circle-3"></div>
    </div>

    <div class="register-container">
      <!-- Back Button -->
      <ion-button fill="clear" class="back-btn" routerLink="/login">
        <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
        Back to Login
      </ion-button>

      <!-- Icon Section -->
      <div class="icon-section">
        <div class="icon-wrapper">
          <ion-icon name="person-add-outline"></ion-icon>
        </div>
      </div>

      <!-- Header -->
      <div class="form-header">
        <h2>Create Account</h2>
        <p>Join us and get started today</p>
      </div>

      <form (ngSubmit)="register()" class="register-form">
        <!-- User Type Selection -->
        <div class="user-type-section">
          <div class="input-label">
            <ion-icon name="people-outline"></ion-icon>
            <span>I am a</span>
          </div>
          <div class="type-buttons">
            <button type="button" class="type-btn" [class.active]="userType === 'teacher'" (click)="userType = 'teacher'; onUserTypeChange()">
              <ion-icon name="person-outline"></ion-icon>
              <span>Teacher</span>
            </button>
            <button type="button" class="type-btn" [class.active]="userType === 'admin'" (click)="userType = 'admin'; onUserTypeChange()">
              <ion-icon name="school-outline"></ion-icon>
              <span>Admin</span>
            </button>
          </div>
        </div>

        <div class="input-group">
          <div class="input-label">
            <ion-icon name="person-outline"></ion-icon>
            <span>Full Name</span>
          </div>
          <div class="input-wrapper">
            <ion-input
              type="text"
              [(ngModel)]="name"
              name="name"
              placeholder="Enter your full name"
              required
            ></ion-input>
          </div>
        </div>

        <div class="input-group" *ngIf="userType === 'admin'">
          <div class="input-label">
            <ion-icon name="school-outline"></ion-icon>
            <span>School Name</span>
          </div>
          <div class="input-wrapper">
            <ion-input
              type="text"
              [(ngModel)]="schoolName"
              name="schoolName"
              placeholder="Enter school name"
            ></ion-input>
          </div>
        </div>

        <!-- Teacher ID Field (for teachers only) -->
        <div class="input-group" *ngIf="userType === 'teacher'">
          <div class="input-label">
            <ion-icon name="id-card-outline"></ion-icon>
            <span>Teacher ID</span>
          </div>
          <div class="input-wrapper">
            <ion-input
              type="text"
              [(ngModel)]="teacherId"
              name="teacherId"
              placeholder="Enter your Teacher ID"
              (ionBlur)="validateTeacherId()"
              [disabled]="isLoading || validatingTeacherId"
            ></ion-input>
            <ion-button
              fill="clear"
              (click)="validateTeacherId()"
              class="validate-btn"
              type="button"
              [disabled]="!teacherId.trim() || validatingTeacherId"
            >
              <ion-spinner *ngIf="validatingTeacherId" name="crescent"></ion-spinner>
              <ion-icon *ngIf="!validatingTeacherId" name="checkmark-circle-outline"></ion-icon>
            </ion-button>
          </div>
          <div class="validation-message" *ngIf="teacherIdMessage">
            <ion-icon
              [name]="teacherIdValid ? 'checkmark-circle' : 'close-circle'"
              [class.valid]="teacherIdValid"
              [class.invalid]="!teacherIdValid"
            ></ion-icon>
            <span [class.valid]="teacherIdValid" [class.invalid]="!teacherIdValid">
              {{ teacherIdMessage }}
            </span>
          </div>
          <div class="verified-name" *ngIf="verifiedTeacherName && teacherIdValid">
            <ion-icon name="person-outline"></ion-icon>
            <span>Verified: {{ verifiedTeacherName }}</span>
          </div>
        </div>

        <div class="input-group">
          <div class="input-label">
            <ion-icon name="mail-outline"></ion-icon>
            <span>Email Address</span>
          </div>
          <div class="input-wrapper">
            <ion-input
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="Enter your email"
              required
            ></ion-input>
          </div>
        </div>

        <div class="input-group">
          <div class="input-label">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <span>Password</span>
          </div>
          <div class="input-wrapper">
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="At least 6 characters"
              required
            ></ion-input>
            <ion-button fill="clear" (click)="togglePasswordVisibility()" class="toggle-btn" type="button">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </div>
        </div>

        <div class="input-group">
          <div class="input-label">
            <ion-icon name="checkmark-done-outline"></ion-icon>
            <span>Confirm Password</span>
          </div>
          <div class="input-wrapper">
            <ion-input
              [type]="showConfirmPassword ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
            ></ion-input>
            <ion-button fill="clear" (click)="toggleConfirmPasswordVisibility()" class="toggle-btn" type="button">
              <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </div>
        </div>

        <ion-button expand="block" type="submit" class="submit-btn" [disabled]="isLoading">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">
            <ion-icon name="checkmark-circle-outline"></ion-icon>
            Create Account
          </span>
        </ion-button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>or</span>
      </div>

      <!-- Login Link -->
      <div class="login-section">
        <p>Already have an account?</p>
        <ion-button expand="block" fill="outline" routerLink="/login" class="login-btn">
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          Sign In
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
