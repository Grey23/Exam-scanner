<ion-content class="reset-content">
  <div class="reset-wrapper">
    <!-- Decorative Background -->
    <div class="bg-decoration">
      <div class="bg-circle bg-circle-1"></div>
      <div class="bg-circle bg-circle-2"></div>
      <div class="bg-circle bg-circle-3"></div>
    </div>

    <div class="reset-container">
      <!-- Logo/Icon Section -->
      <div class="reset-icon-section">
        <div class="icon-wrapper">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>
      </div>

      <!-- Loading State -->
      <div *ngIf="isLoading" class="loading-state">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Verifying reset link...</p>
      </div>

      <!-- Invalid/Expired State -->
      <div *ngIf="!isLoading && !email" class="invalid-state">
        <div class="error-icon">
          <ion-icon name="close-circle-outline"></ion-icon>
        </div>
        <h2>Link Expired</h2>
        <p>This password reset link is invalid or has expired. Please request a new one.</p>
        <ion-button expand="block" routerLink="/login" class="primary-btn">
          <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
          Back to Login
        </ion-button>
      </div>

      <!-- Reset Form -->
      <div *ngIf="!isLoading && email" class="reset-form-container">
        <div class="form-header">
          <h2>Create New Password</h2>
          <p>Secure your account with a strong password</p>
          <div class="user-email">
            <ion-icon name="mail-outline"></ion-icon>
            <span>{{ email }}</span>
          </div>
        </div>

        <form (ngSubmit)="submit()" class="reset-form">
          <div class="input-group">
            <div class="input-label">
              <ion-icon name="lock-closed-outline"></ion-icon>
              <span>New Password</span>
            </div>
            <div class="input-wrapper">
              <ion-input
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="newPassword"
                name="newPassword"
                placeholder="Enter new password"
                required
              ></ion-input>
              <ion-button fill="clear" (click)="togglePasswordVisibility()" class="toggle-btn" type="button">
                <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </ion-button>
            </div>
            <div class="input-hint">Minimum 6 characters</div>
          </div>

          <div class="input-group">
            <div class="input-label">
              <ion-icon name="checkmark-done-outline"></ion-icon>
              <span>Confirm Password</span>
            </div>
            <div class="input-wrapper">
              <ion-input
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter new password"
                required
              ></ion-input>
            </div>
          </div>

          <ion-button expand="block" type="submit" class="submit-btn" [disabled]="isSubmitting">
            <ion-spinner *ngIf="isSubmitting" name="crescent"></ion-spinner>
            <span *ngIf="!isSubmitting">
              <ion-icon name="checkmark-circle-outline"></ion-icon>
              Update Password
            </span>
          </ion-button>

          <ion-button expand="block" fill="clear" routerLink="/login" class="back-btn" type="button">
            <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
            Return to Login
          </ion-button>
        </form>
      </div>
    </div>
  </div>
</ion-content>
