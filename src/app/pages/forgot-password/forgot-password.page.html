<ion-content class="forgot-content">
  <div class="forgot-wrapper">
    <!-- Decorative Background -->
    <div class="bg-decoration">
      <div class="bg-circle bg-circle-1"></div>
      <div class="bg-circle bg-circle-2"></div>
      <div class="bg-circle bg-circle-3"></div>
    </div>

    <div class="forgot-container">
      <!-- Icon Section -->
      <div class="icon-section">
        <div class="icon-wrapper">
          <ion-icon name="mail-unread-outline"></ion-icon>
        </div>
      </div>

      <!-- Email Sent Success -->
      <div *ngIf="emailSent" class="success-state">
        <div class="success-icon">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </div>
        <h2>Email Sent!</h2>
        <p>We've sent a password reset link to</p>
        <div class="sent-email">{{ email }}</div>
        <p class="hint">Check your inbox and follow the instructions to reset your password.</p>
        <ion-button expand="block" (click)="goBack()" class="primary-btn">
          <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
          Back to Login
        </ion-button>
      </div>

      <!-- Request Form -->
      <div *ngIf="!emailSent" class="form-section">
        <div class="form-header">
          <h2>Forgot Password?</h2>
          <p>Enter your registered email address and we'll send you a link to reset your password.</p>
        </div>

        <form (ngSubmit)="sendResetEmail()" class="forgot-form">
          <div class="input-group">
            <div class="input-label">
              <ion-icon name="mail-outline"></ion-icon>
              <span>Email Address</span>
            </div>
            <div class="input-wrapper">
              <ion-input
                type="email"
                [(ngModel)]="email"
                name="email"
                placeholder="Enter your registered email"
                required
              ></ion-input>
            </div>
          </div>

          <ion-button expand="block" type="submit" class="submit-btn" [disabled]="isLoading">
            <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
            <span *ngIf="!isLoading">
              <ion-icon name="send-outline"></ion-icon>
              Send Reset Link
            </span>
          </ion-button>

          <ion-button expand="block" fill="clear" (click)="goBack()" class="back-btn" type="button">
            <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
            Back to Login
          </ion-button>
        </form>
      </div>
    </div>
  </div>
</ion-content>
