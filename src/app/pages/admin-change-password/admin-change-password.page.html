<app-admin-sidebar 
  menuId="admin-menu" 
  contentId="admin-content" 
  activePage="password">
</app-admin-sidebar>

<ion-header class="admin-header">
  <ion-toolbar color="primary" class="header-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button menu="admin-menu" auto-hide="false" class="menu-button"></ion-menu-button>
    </ion-buttons>
    <div class="header-title-section">
      <ion-title class="header-title">Change User Password</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content id="admin-content" class="admin-page-content">
  <div class="page-container">
    <div class="grid">
      <ion-card class="card">
        <ion-card-header>
          <ion-card-title>Select User</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <ion-searchbar
            [(ngModel)]="userSearch"
            placeholder="Search users"
            debounce="200"
          ></ion-searchbar>

          <div *ngIf="isLoadingUsers" class="loading">
            <ion-spinner name="crescent"></ion-spinner>
            <p>Loading users...</p>
          </div>

          <ion-list *ngIf="!isLoadingUsers" lines="inset" class="user-list">
            <ion-radio-group [(ngModel)]="selectedUid">
              <ion-item *ngFor="let u of filteredUsers" class="user-item">
                <ion-radio slot="start" [value]="u.id"></ion-radio>
                <ion-label>
                  <h2>{{ u.name || 'Unnamed' }}</h2>
                  <p>{{ u.email }}</p>
                </ion-label>
              </ion-item>
            </ion-radio-group>
          </ion-list>

          <div *ngIf="!isLoadingUsers && filteredUsers.length === 0" class="empty">
            No users found.
          </div>
        </ion-card-content>
      </ion-card>

      <ion-card class="card">
        <ion-card-header>
          <ion-card-title>Set New Password</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <ion-item>
            <ion-label position="stacked">New Password</ion-label>
            <ion-input [(ngModel)]="newPassword" type="password" placeholder="At least 6 characters"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Confirm Password</ion-label>
            <ion-input [(ngModel)]="confirmPassword" type="password" placeholder="Re-type password"></ion-input>
          </ion-item>

          <ion-button expand="block" color="primary" (click)="submit()" [disabled]="isSubmitting">
            <ion-spinner *ngIf="isSubmitting" name="crescent" style="margin-right:8px"></ion-spinner>
            Update Password
          </ion-button>

          <div class="hint">
            This action updates the user's Firebase Auth password.
          </div>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
